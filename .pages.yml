media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: events
    label: Kalender
    type: collection
    path: _events
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, start, location]
      primary: title
      sort: start
      order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: start
        label: Beginn
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm"
      - name: end
        label: Ende
        description: Optional. Ohne Ende wird der Termin mit 2 Stunden eingetragen.
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd HH:mm"
      - name: date_label
        label: Datum als Text (optional)
        description: "Wenn der genaue Tag noch nicht feststeht, z. B. „Januar 2027 – genauer Termin folgt“. Ersetzt die Datumsanzeige auf der Website; für den iCal-Kalender Beginn/Ende trotzdem setzen (z. B. ganzer Monat, ganztägig)."
        type: string
      - name: all_day
        label: Ganztägig
        description: Uhrzeiten werden dann ignoriert.
        type: boolean
        default: false
      - name: persoenlich
        label: Persönlicher Termin
        description: "Privater Termin einer Person aus dem Team (unter „Dabei aus dem Team“ eintragen): erscheint nicht auf der Startseite, im Kalender und im iCal-Abo, sondern nur im Teamprofil."
        type: boolean
        default: false
      - name: nur_projekt
        label: Nur fürs Projekt (bis er stattgefunden hat)
        description: Kommende Termine erscheinen dann nicht auf der Startseite, im Kalender und im iCal-Abo, sondern nur auf der Projektseite (über die Kategorie). Nach dem Termin erscheint er ganz normal unter „Vergangene Termine“.
        type: boolean
        default: false
      - name: verlinkt
        label: Verlinkt mit (Adressen, z. B. /projekte/openpress-bauen/ oder /team/anton/)
        description: Beliebige Seiten verlinken – Projekte, Termine, Beiträge, Personen, Ausstattung, Partnerseiten. Die Verbindung erscheint unten auf beiden Seiten; ein Eintrag auf einer Seite reicht.
        type: string
        list: true
      - name: tags
        label: Kategorien (z. B. ktg)
        description: Projekte mit derselben Kategorie unter „Termine-Kategorie“ zeigen diesen Termin automatisch an.
        type: string
        list: true
      - name: projekte
        label: Gehört zu den Projekten (Kürzel, z. B. openpress-bauen)
        description: Der Termin erscheint auf jeder dieser Projektseiten unter „Termine & Berichte“ – zusätzlich zu Projekten mit passender Kategorie.
        type: string
        list: true
      - name: partners
        label: Partner (Name wie in der Partnerliste)
        description: Der Termin erscheint dann bei diesem Partner auf der Partnerseite.
        type: string
        list: true
      - name: team
        label: Dabei aus dem Team (Kürzel, z. B. falko-richter)
        description: Der Termin erscheint dann im Teamprofil unter „Termine“.
        type: string
        list: true
      - name: location
        label: Ort
        type: string
      - name: location_url
        label: Link zum Ort (z. B. Karte)
        type: string
      - name: summary
        label: Kurzbeschreibung
        description: Erscheint in der Terminliste und im iCal-Kalender.
        type: text
      - name: body
        label: Beschreibung
        type: rich-text
        options:
          format: markdown
      - name: gallery
        label: Fotos
        description: Achtung – Handyfotos enthalten oft GPS-Daten. Vorher Metadaten entfernen oder Falko fragen.
        type: object
        list: true
        fields:
          - name: image
            label: Bild
            type: image
          - name: thumb
            label: Vorschaubild (optional, ca. 600 px)
            type: image
          - name: alt
            label: Bildbeschreibung
            type: string

  - name: posts
    label: Neuigkeiten
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm"
      - name: author
        label: Autor*in (Team-Kürzel, z. B. falko-richter)
        type: string
      - name: persoenlich
        label: Persönlicher Beitrag
        description: "Privates Makespace-Update einer Person aus dem Team: erscheint nicht unter Neuigkeiten, sondern im Profil (Autor*in) und unter „Persönliche Blogs“."
        type: boolean
      - name: verlinkt
        label: Verlinkt mit (Adressen, z. B. /projekte/openpress-bauen/ oder /team/anton/)
        description: Beliebige Seiten verlinken – Projekte, Termine, Beiträge, Personen, Ausstattung, Partnerseiten. Die Verbindung erscheint unten auf beiden Seiten; ein Eintrag auf einer Seite reicht.
        type: string
        list: true
      - name: tags
        label: Kategorien (z. B. ktg)
        description: Projekte mit derselben „Termine-Kategorie“ listen diesen Beitrag automatisch auf.
        type: string
        list: true
      - name: original_url
        label: Ursprünglich veröffentlicht unter (URL)
        type: string
      - name: original_site
        label: Name der Originalseite
        type: string
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown

  - name: projects
    label: Projekte
    type: collection
    path: _projects
    filename: "{primary}.md"
    view:
      fields: [title, status, start]
      primary: title
      sort: start
      order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: summary
        label: Kurzbeschreibung
        type: text
      - name: status
        label: Status
        type: select
        default: aktuell
        options:
          values: [idee, anfrage, aktuell, abgeschlossen]
      - name: persoenlich
        label: Persönliches Projekt
        description: "Privates Projekt einer Person aus dem Team (unter Team eintragen): erscheint nicht in den Projektlisten, sondern im Profil und unter „Persönliche Projekte“."
        type: boolean
      - name: start
        label: Startdatum (für die Sortierung)
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: zeitraum
        label: Zeitraum (Text, z. B. „seit November 2026“)
        type: string
      - name: ort
        label: Ort
        type: string
      - name: teil_von
        label: Teilprojekt von (Kürzel der Projekte, z. B. 3d-druck-ag-ktg)
        description: Teilprojekte erscheinen nicht in den Projektübersichten, sondern unter „Teilprojekte“ auf der Seite jedes übergeordneten Projekts. Ein Teilprojekt kann zu mehreren Projekten gehören.
        type: string
        list: true
      - name: verwandt
        label: Verwandte Projekte (Kürzel, z. B. ipad-stifte-wiederbeleben)
        description: Erscheinen unten unter „Verwandte Projekte“ – auf beiden Seiten, es reicht ein Eintrag bei einem der Projekte.
        type: string
        list: true
      - name: event_tag
        label: Termine-Kategorie (z. B. ktg)
        description: Alle Termine mit dieser Kategorie werden auf der Projektseite aufgelistet.
        type: string
      - name: updates
        label: Stand / Updates
        description: Kurze Notizen zum Fortschritt – neuestes zuerst wird automatisch sortiert. Längere Updates mit Fotos lieber als Beitrag mit dem Stichwort aus „Termine-Kategorie“ schreiben, die erscheinen hier automatisch. Links bitte als normale Markdown-Links.
        type: object
        list: true
        fields:
          - name: datum
            label: Datum
            type: date
            options:
              format: "yyyy-MM-dd"
          - name: text
            label: Text
            type: text
      - name: image
        label: Bild
        type: image
      - name: team
        label: Team (Kürzel, z. B. falko-richter)
        type: string
        list: true
      - name: partners
        label: Partner (Name wie in der Partnerliste)
        type: string
        list: true
      - name: body
        label: Beschreibung
        type: rich-text
        options:
          format: markdown
      - name: verlinkt
        label: Verlinkt mit (Adressen, z. B. /projekte/openpress-bauen/ oder /team/anton/)
        description: Beliebige Seiten verlinken – Projekte, Termine, Beiträge, Personen, Ausstattung, Partnerseiten. Die Verbindung erscheint unten auf beiden Seiten; ein Eintrag auf einer Seite reicht.
        type: string
        list: true

  - name: team
    label: Team
    type: collection
    path: _team
    filename: "{primary}.md"
    view:
      fields: [title, role, order]
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: role
        label: Rolle
        type: string
      - name: order
        label: Reihenfolge
        type: number
      - name: photo
        label: Foto (quadratisch, ca. 480 px)
        description: Achtung – Handyfotos enthalten oft GPS-Daten. Vorher Metadaten entfernen oder Falko fragen.
        type: image
      - name: photo_2x
        label: Foto in doppelter Auflösung (ca. 960 px, optional)
        type: image
      - name: photo_icon
        label: Mini-Foto für den Kalender (quadratisch, 48 px, optional)
        description: Rundes Gesicht auf der Kalenderseite. Ohne Mini-Foto wird das normale Foto verkleinert.
        type: image
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: title
            label: Bezeichnung
            type: string
          - name: url
            label: URL
            type: string
      - name: body
        label: Profiltext
        type: rich-text
        options:
          format: markdown
      - name: verlinkt
        label: Verlinkt mit (Adressen, z. B. /projekte/openpress-bauen/ oder /team/anton/)
        description: Beliebige Seiten verlinken – Projekte, Termine, Beiträge, Personen, Ausstattung, Partnerseiten. Die Verbindung erscheint unten auf beiden Seiten; ein Eintrag auf einer Seite reicht.
        type: string
        list: true

  - name: equipment
    label: Ausstattung
    type: collection
    path: _equipment
    filename: "{primary}.md"
    view:
      fields: [title, kategorie]
      primary: title
      sort: title
      order: asc
    fields:
      - name: title
        label: Name des Geräts
        type: string
        required: true
      - name: kategorie
        label: Kategorie (z. B. 3D-Drucker (FDM), Schneidplotter, Messgerät)
        type: string
      - name: summary
        label: Kurzbeschreibung
        type: text
      - name: owner_partner
        label: Gehört Partner (Namen wie in der Partnerliste)
        description: Ein Gerät kann mehreren gehören – Partner, Teammitglieder und andere lassen sich kombinieren. Das Institut selbst besitzt (noch) keine Geräte.
        type: string
        list: true
      - name: owner_team
        label: Gehört Teammitglied (Kürzel, z. B. falko-richter)
        type: string
        list: true
      - name: owner_name
        label: Gehört jemand anderem (Name, falls weder Partner noch Team)
        type: string
        list: true
      - name: standort
        label: Standort (Text, z. B. „Kurt-Tucholsky-Grundschule (3D-Druck AG)“)
        description: Wo das Gerät steht. Erscheint auf der Geräteseite und im Netzwerk als Ort.
        type: string
      - name: standort_partner
        label: Standort bei Partner (Name wie in der Partnerliste)
        description: Optional – verlinkt den Standort mit dem Partner, im Netzwerk als Linie „steht bei“.
        type: string
      - name: status
        label: Status
        description: "„in-aussicht“ = Gerät kommt vielleicht, ist aber noch nicht da"
        type: select
        options:
          values: ["", in-aussicht]
      - name: image
        label: Foto
        description: Achtung – Fotos ohne Metadaten und ohne lesbare Namen/Gesichter von Kindern hochladen.
        type: image
      - name: thumb
        label: Vorschaubild (optional, ca. 600 px)
        type: image
      - name: image_alt
        label: Bildbeschreibung
        type: string
      - name: image_caption
        label: Bildunterschrift (optional, sichtbar unter dem Foto)
        type: string
      - name: verlinkt
        label: Verlinkt mit (Adressen, z. B. /projekte/openpress-bauen/ oder /team/anton/)
        description: Beliebige Seiten verlinken – Projekte, Termine, Beiträge, Personen, Ausstattung, Partnerseiten. Die Verbindung erscheint unten auf beiden Seiten; ein Eintrag auf einer Seite reicht.
        type: string
        list: true
      - name: tags
        label: Stichworte (z. B. 3d-drucker, 35services, ktg)
        description: Alles mit denselben Stichworten wird automatisch verknüpft.
        type: string
        list: true
      - name: body
        label: Beschreibung
        type: rich-text
        options:
          format: markdown

  - name: press
    label: Pressemitteilungen
    type: collection
    path: _press
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: subtitle
        label: Untertitel
        type: string
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"
      - name: verlinkt
        label: Verlinkt mit (Adressen, z. B. /projekte/openpress-bauen/ oder /team/anton/)
        description: Beliebige Seiten verlinken – Projekte, Termine, Beiträge, Personen, Ausstattung, Partnerseiten. Die Verbindung erscheint unten auf beiden Seiten; ein Eintrag auf einer Seite reicht.
        type: string
        list: true
      - name: tags
        label: Stichworte (z. B. ktg)
        type: string
        list: true
      - name: contact_name
        label: Pressekontakt für diese Mitteilung (optional, sonst der allgemeine)
        type: string
      - name: contact_email_b64
        label: E-Mail des Kontakts, base64-kodiert
        description: "Erzeugen im Terminal: printf 'name@example.org' | base64"
        type: string
      - name: contact_email_anzeige
        label: Anzeigetext der E-Mail (z. B. name [at] example.org)
        type: string
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown

  - name: presse
    label: Presse – Kurzprofil & Kontakt
    type: file
    path: _data/presse.yml
    fields:
      - name: kurzprofil
        label: Kurzprofil
        type: text
      - name: kontakt_name
        label: Pressekontakt – Name
        type: string
      - name: kontakt_email_b64
        label: Pressekontakt – E-Mail (base64-kodiert)
        description: "Damit Spam-Bots die Adresse nicht finden. Erzeugen im Terminal: printf 'presse@ifsmb.de' | base64"
        type: string
      - name: kontakt_email_anzeige
        label: Pressekontakt – Anzeigetext der E-Mail (z. B. presse [at] ifsmb.de)
        type: string
      - name: kontakt_telefon
        label: Pressekontakt – Telefon (sichtbar im Quelltext; besser das Feld darunter)
        type: string
      - name: kontakt_telefon_b64
        label: Pressekontakt – Telefon (base64-kodiert, wird per JavaScript angezeigt)
        type: string
      - name: bildnachweis
        label: Bildnachweis für Pressefotos
        type: string

  - name: pressematerial
    label: Presse – Material zum Download
    type: file
    path: _data/pressematerial.yml
    list: true
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung (Format, Größe)
        type: string
      - name: file
        label: Datei
        type: file
      - name: preview
        label: Vorschaubild
        type: image

  - name: partners
    label: Partner
    type: file
    path: _data/partners.yml
    list: true
    fields:
      - name: name
        label: Name
        type: string
      - name: url
        label: Website
        type: string
      - name: instagram
        label: Instagram-Profil (optional)
        type: string
      - name: logo
        label: Logo
        type: image
      - name: logo_dark
        label: Logo braucht dunklen Hintergrund
        type: boolean
      - name: page
        label: Eigene Seite (optional, z. B. /partner/taschenstation/)
        description: Pfad zu einer Unterseite mit mehr Infos zur Zusammenarbeit. Die Seite selbst liegt als Datei unter partner/<name>/index.md.
        type: string
      - name: description
        label: Beschreibung
        type: string
