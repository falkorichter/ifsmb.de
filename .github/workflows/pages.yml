# Baut die Seite für GitHub Pages (ifsmb.de) und danach den Suchindex mit Pagefind.
# Der eingebaute Jekyll-Build von Pages kann keinen Schritt nach dem Build ausführen,
# deshalb dieser Workflow (Settings → Pages → Source: „GitHub Actions“).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Steht die Pages-Quelle auf „Deploy from a branch“, baut GitHub parallel selbst mit Jekyll
      # und überschreibt diese Version – ohne /pagefind/, die Suche ist dann kaputt (Issue #13).
      - name: Pages-Quelle prüfen (muss „GitHub Actions“ sein)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages-Quelle ist '$build_type' statt 'workflow': Settings → Pages → Build and deployment → Source auf „GitHub Actions“ stellen, sonst fehlt der Suchindex."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # .ruby-version (3.1.2) gibt es auf neuen Runnern nicht mehr – neuestes 3.1.x nehmen
          ruby-version: "3.1"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # Volltext-Suchindex für /suche/ (Pagefind liest das fertige HTML → _site/pagefind/)
      - run: npx -y pagefind@1.5.2 --site _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
