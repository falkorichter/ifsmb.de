# Checks every pull request before it can be merged: galleries must be Markdown, the forms must
# write files that fit Pages CMS (_scripts/test_formulare.rb), the UI strings must be complete in
# German, English and French (_scripts/test_i18n.rb),
# the site must build (the gallery plugin stops on images without alt text),
# and the link check must pass.
name: Prüfen

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Galerien in Markdown prüfen
        run: ruby _scripts/check_galerien.rb
      - name: Fotos auf Geokoordinaten prüfen
        run: ruby _scripts/check_geodaten.rb
      - name: Seiten-Kennungen (uuid) prüfen
        run: ruby _scripts/uuids_ergaenzen.rb --pruefen
      - name: Formulare und Pages-CMS-Felder testen
        run: ruby _scripts/test_formulare.rb
      - name: Links zu verbundenen Instanzen (Föderation) testen
        run: ruby _scripts/test_federation_links.rb
      - name: Mehrere Instanzen (Überschreibungen, ifpage) testen
        run: ruby _scripts/test_instanz.rb
      - name: Zusammenführen (Konflikte) testen
        run: node _scripts/test_merge.js
      - name: Verschlüsselte Seiten (Markdown-Renderer, Krypto) testen
        run: node --test _scripts/test_crypto.js
      - name: Seite bauen
        run: bundle exec jekyll build
      - name: Links und erreichbare Seiten prüfen
        run: ruby _scripts/check_site.rb
      - name: Sprachen der Bedienung prüfen (de/en/fr)
        run: ruby _scripts/test_i18n.rb
      - name: same_as (dieselbe Sache auf anderen Instanzen) testen
        run: ruby _scripts/test_same_as.rb
