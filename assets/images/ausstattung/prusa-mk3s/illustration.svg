<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-label="Illustration eines kartesischen 3D-Druckers">
  <title>Illustration: kartesischer 3D-Drucker (Bauart Prusa)</title>
  <rect width="360" height="340" fill="#ffffff"/>
  <g fill="none" stroke="#16161d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- frame (portal) -->
    <path d="M90 300 L90 40 L270 40 L270 300" stroke-width="9" stroke="#ff5a36"/>
    <!-- Z rods -->
    <line x1="110" y1="45" x2="110" y2="290" stroke="#9a9aa6"/>
    <line x1="250" y1="45" x2="250" y2="290" stroke="#9a9aa6"/>
    <!-- X axis -->
    <line x1="95" y1="140" x2="265" y2="140"/>
    <line x1="95" y1="152" x2="265" y2="152"/>
    <!-- extruder -->
    <rect x="160" y="118" width="44" height="58" rx="5" fill="#ffffff"/>
    <circle cx="182" cy="147" r="11" fill="#e5e1d8"/>
    <path d="M176 176 L188 176 L182 190 Z" fill="#16161d"/>
    <!-- filament -->
    <path d="M182 118 C182 80 230 70 300 60" stroke="#ffcc00" stroke-width="4"/>
    <circle cx="310" cy="58" r="22" fill="#ffffff"/>
    <circle cx="310" cy="58" r="7" fill="#16161d"/>
    <!-- bed (Y axis) -->
    <path d="M40 255 L320 255 L295 285 L65 285 Z" fill="#e5e1d8"/>
    <!-- print -->
    <rect x="160" y="222" width="44" height="33" fill="#ff5a36"/>
    <!-- base -->
    <line x1="40" y1="305" x2="320" y2="305" stroke-width="7"/>
    <!-- display -->
    <rect x="58" y="290" width="40" height="22" rx="3" fill="#ffcc00"/>
  </g>
</svg>
