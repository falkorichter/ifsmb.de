<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} – Neuigkeiten" href="{{ '/feed.xml' | relative_url }}">

  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="{{ site.title }}">
  <meta property="og:title"       content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url"         content="{{ site.url }}{{ page.url }}">
  <meta property="og:locale"      content="de_DE">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">IfsMB</span>
        <span class="brand-name">Institut für spontane<br>Makespace Buildung</span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menü öffnen">
      <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
      <nav class="site-nav">
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><strong>{{ site.title }}</strong><br>{{ site.description }}</p>
      <p>
        <a href="{{ '/impressum/' | relative_url }}">Impressum &amp; Datenschutz</a> ·
        <a href="{{ '/projekte/archiv/' | relative_url }}">Vergangene Projekte</a> ·
        <a href="https://github.com/falkorichter/ifsmb.de" target="_blank" rel="noopener">Quelltext auf GitHub</a>
      </p>
      <p class="footer-note">Diese Seite setzt keine Cookies und lädt keine externen Inhalte.</p>
    </div>
  </footer>

  <script>
    document.querySelectorAll('.obf-mail').forEach(function (a) {
      var m = atob(a.dataset.em);
      a.href = 'mailto:' + m;
      a.textContent = m;
    });
  </script>
</body>
</html>
