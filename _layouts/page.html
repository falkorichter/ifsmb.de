---
layout: default
---
<main class="container page">
  <header class="page-header">
    {%- comment -%}Overview pages may name UI strings for title and lead (i18n_title / i18n_lead, _data/i18n/*.yml) – content pages stay German.{%- endcomment %}
    <h1{% if page.i18n_title %} data-i18n="{{ page.i18n_title }}"{% endif %}>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead"{% if page.i18n_lead %} data-i18n="{{ page.i18n_lead }}"{% endif %}>{{ page.lead }}</p>{% endif %}
  </header>
  {{ content }}
</main>
