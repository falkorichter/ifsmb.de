---
layout: default
---
<main class="container page narrow">
  <article>
    <header class="page-header">
      <p class="meta">{{ page.date | date: "%d.%m.%Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
    </header>
    <div class="prose">
      {{ content }}
    </div>
    <a href="{{ '/news/' | relative_url }}" class="back-link">← Alle Neuigkeiten</a>
  </article>
</main>
