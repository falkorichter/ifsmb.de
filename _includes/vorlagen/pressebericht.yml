{%- comment -%}
  Template for a "Wir in der Presse" entry as its own file (_data/pressebericht/<name>.yml),
  sorted into the list by _plugins/einzeldateien.rb. JJJJ-MM-TT is replaced with today's date at click time.
{%- endcomment -%}
# Neuer Bericht über uns für „Wir in der Presse“ auf /presse/ – wird automatisch nach Datum einsortiert (neueste zuerst).
# Dateiname oben anpassen: datum-und-medium.yml (nur Kleinbuchstaben und Bindestriche).
datum: JJJJ-MM-TT   # Erscheinungsdatum – ganz löschen, wenn unbekannt (steht dann am Ende der Liste)
titel: "Überschrift des Berichts"
medium: "Name der Zeitung, Website oder des Kanals"   # z. B. „Bezirksamt Mitte auf Bluesky“
url: https://beispiel.de/artikel   # Pflicht: Link zum Bericht, ohne Tracking-Parameter (?si=, utm_ …)
anlass:   # optional: unsere eigene Seite zum Anlass, z. B. /kalender/…/ oder /news/…/
hinweis:   # optional: Anmerkung, erscheint in Klammern hinter dem Eintrag
