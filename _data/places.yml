# Orte für die Karte (/map/).
#
# id:       kurzer Name, auf den Seiten mit `orte: [<id>]` verweisen können
# name:     Anzeigename
# address:  öffentliche Adresse (Schulen, Vereine, Veranstaltungsorte – nie Wohnadressen von Personen)
# lat, lon: Koordinaten (WGS84, Dezimalgrad), z. B. aus openstreetmap.org: Rechtsklick → „Adresse anzeigen“
# partner:  Name aus _data/partners.yml – Projekte, Termine und Geräte dieses Partners landen hier
# match:    Textstücke (Groß-/Kleinschreibung egal), die in `location` (Termine), `ort` (Projekte)
#           oder `standort` (Ausstattung) vorkommen – dann landet die Seite automatisch an diesem Ort
# remote:   true für Orte außerhalb Berlins – die Karte startet dann trotzdem mit Berlin im Blick
# approximate: true, wenn der Punkt nur die Straße oder Gegend zeigt

