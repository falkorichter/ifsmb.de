# Orte für die Karte (/karte/).
#
# id:       kurzer Name, auf den Seiten mit `orte: [<id>]` verweisen können
# name:     Anzeigename
# adresse:  öffentliche Adresse (Schulen, Vereine, Veranstaltungsorte – nie Wohnadressen von Personen)
# lat, lon: Koordinaten (WGS84, Dezimalgrad), z. B. aus openstreetmap.org: Rechtsklick → „Adresse anzeigen“
# partner:  Name aus _data/partners.yml – Projekte, Termine und Geräte dieses Partners landen hier
# finden:   Textstücke (Groß-/Kleinschreibung egal), die in `location` (Termine), `ort` (Projekte)
#           oder `standort` (Ausstattung) vorkommen – dann landet die Seite automatisch an diesem Ort
# fern:     true für Orte außerhalb Berlins – die Karte startet dann trotzdem mit Berlin im Blick
# ungefaehr: true, wenn der Punkt nur die Straße oder Gegend zeigt

