  todos:
    title: Todos
    lead: Ce que nous prenons en main en ce moment – par personne, dans une matrice d’Eisenhower. Déplacer, modifier, enregistrer en pull request.
  network:
    title: Réseau
    lead: Comment nos projets, défis, todos, rendez-vous, articles, personnes, partenaires et appareils sont reliés. Faites glisser, zoomez, cliquez – et passez d’un point à l’autre.
