    title: Partenaires
    lead: Sans nos partenaires, aucun Makespace ne serait né spontanément. Merci !
  challenges:
    title: Défis
    lead: Notre état des lieux – tâches, problèmes et questions ouvertes de nos projets, rassemblés et documentés. Plus petits qu’un projet, mais souvent exactement là où vous pouvez aider.
