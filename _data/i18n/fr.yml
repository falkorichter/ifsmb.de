    title: Mots-clés
    lead: Tout en un coup d’œil – par thème, lieu, partenaire et appareil.
  search:
    title: Recherche
    lead: Recherche plein texte dans les actualités, projets, rendez-vous, l’équipement, l’équipe et plus encore.
