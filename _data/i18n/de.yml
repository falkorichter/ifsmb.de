  steps_new_3: Nach dem Merge erscheint die Seite nach ein paar Minuten auf der Website.
  steps_edit_1: „Auf GitHub speichern“ kopiert die geänderte Datei und öffnet sie im GitHub-Editor.
  steps_edit_2: Dort den ganzen Inhalt markieren (⌘A / Strg+A) und einfügen (⌘V / Strg+V).
  steps_edit_commit_html: „Commit changes …“ → <strong>„Create a new branch … and start a pull request“</strong>.
  steps_edit_4: Nach dem Merge ist die Änderung nach ein paar Minuten auf der Website.
  steps_pr_new: „Als Pull Request“ legt einen neuen Branch mit der neuen Datei und allen verwendeten Fotos an und öffnet einen Pull Request.
  steps_pr_edit: „Als Pull Request“ legt einen neuen Branch mit der geänderten Datei und allen verwendeten Fotos an und öffnet einen Pull Request.
  steps_pr_review: Jemand aus dem Team sieht ihn durch und mergt ihn – dann ist alles nach ein paar Minuten auf der Website.
