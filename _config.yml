title: Institut für spontane Makespace Buildung
short_title: IfsMB
description: Wir bauen Makespaces – spontan, gemeinsam und dort, wo Kinder und Jugendliche lernen.
baseurl: ""
url: "https://ifsmb.de"
lang: de
timezone: Europe/Berlin
future: true

markdown: kramdown
permalink: /news/:year/:month/:day/:title/

collections:
  team:
    output: true
    permalink: /team/:name/
  projects:
    output: true
    permalink: /projekte/:name/
  events:
    output: true
    permalink: /kalender/:name/
  press:
    output: true
    permalink: /presse/:slug/
  equipment:
    output: true
    permalink: /ausstattung/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "member"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "press"
    values:
      layout: "press"
  - scope:
      path: ""
      type: "equipment"
    values:
      layout: "equipment"

nav:
  - title: Neuigkeiten
    url: /news/
  - title: Kalender
    url: /kalender/
  - title: Wir
    children:
      - title: Projekte
        url: /projekte/
      - title: Angebot
        url: /angebot/
      - title: Ausstattung
        url: /ausstattung/
      - title: Team
        url: /team/
  - title: Partner
    url: /partner/
  - title: Presse
    url: /presse/
  - title: Suche
    url: /suche/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CLAUDE.md
  - LICENSE
  - .pages.yml
  - todo.md
